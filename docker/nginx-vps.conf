# Contoh server block Nginx untuk VPS (tanpa Docker). Sesuaikan domain, path, dan versi PHP-FPM.
server {
    listen 80;
    server_name contoh-domain.com www.contoh-domain.com;
    root /var/www/katniss-store/public;     # HANYA folder public yang diekspos

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php;
    charset utf-8;
    client_max_body_size 8M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Blokir file tersembunyi (.env, .git), kecuali .well-known untuk sertifikat SSL
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
