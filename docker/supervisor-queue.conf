; Contoh konfigurasi Supervisor untuk queue worker di VPS (jika QUEUE_CONNECTION=database/redis).
[program:katniss-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/katniss-store/artisan queue:work --sleep=3 --tries=1 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/katniss-store/storage/logs/queue-worker.log
stopwaitsecs=3600
